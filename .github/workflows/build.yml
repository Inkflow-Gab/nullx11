name: Build NullX11

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Restore signing keystore (from Actions secret)
        env:
          KEYSTORE_B64: ${{ secrets.NULLX11_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/nullx11-release.keystore"
          test -s "$GITHUB_WORKSPACE/nullx11-release.keystore" || { echo "::error::Keystore secret is empty"; exit 1; }

      - name: Build signed release APK
        env:
          NULLX11_KEYSTORE: ${{ github.workspace }}/nullx11-release.keystore
          NULLX11_KEYSTORE_PASSWORD: ${{ secrets.NULLX11_KEYSTORE_PASSWORD }}
          NULLX11_KEY_ALIAS: ${{ secrets.NULLX11_KEY_ALIAS }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" > signing_report.txt 2>&1 || true
            cat signing_report.txt
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullX11-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ------- Release pipeline: runs only when you push a tag like v1.0 -------
      - name: Read version from build file
        if: startsWith(github.ref, 'refs/tags/v')
        id: ver
        run: |
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "App version: $NAME (code $CODE)"

      - name: Extract APK SHA-256 fingerprint
        if: startsWith(github.ref, 'refs/tags/v')
        id: sig
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          FP=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
              | grep -oE '[0-9a-f]{64}' | head -1)
          test "${#FP}" = 64 || { echo "::error::Fingerprint extraction failed"; exit 1; }
          echo "sha256=$FP" >> "$GITHUB_OUTPUT"

      - name: Write updater metadata (version.json + signature.txt)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SHA256: ${{ steps.sig.outputs.sha256 }}
          VCODE: ${{ steps.ver.outputs.code }}
          VNAME: ${{ steps.ver.outputs.name }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # checkout may not carry the annotated tag object — refetch it so
          # the %(contents:*) fields read the tag annotation, not a ref that
          # points straight at the commit
          git fetch --force origin "+refs/tags/${TAG}:refs/tags/${TAG}" >/dev/null 2>&1 || true
          # single-paragraph tags live entirely in "subject", so merge both
          TAG_SUBJECT="$(git tag -l "$TAG" --format='%(contents:subject)')"
          TAG_BODY="$(git tag -l "$TAG" --format='%(contents:body)')"
          if [ -n "$TAG_BODY" ]; then
            export NOTES="$TAG_SUBJECT
$TAG_BODY"
          else
            export NOTES="$TAG_SUBJECT"
          fi
          python3 - <<'PY'
          import json, os
          version = os.environ["VNAME"].strip()
          meta = {
              "versionCode": int(os.environ["VCODE"]),
              "versionName": version,
              "apkUrl": f"https://github.com/{os.environ['REPO']}/releases/download/{os.environ['TAG']}/NullX11-{version}.apk",
              "releaseNotes": (os.environ.get("NOTES", "") or "").strip() or f"NullX11 {version}",
              "mandatory": False,
          }
          with open("version.json", "w", encoding="utf-8") as fh:
              json.dump(meta, fh, indent=2)
              fh.write("\n")
          with open("signature.txt", "w", encoding="utf-8") as fh:
              fh.write(os.environ["SHA256"] + "\n")
          PY
          echo "--- version.json ---"
          cat version.json

      - name: Commit updater metadata to main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "NullX11 Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json signature.txt
          if git diff --cached --quiet; then
            echo "Updater metadata unchanged."
          else
            git commit -m "chore: updater metadata for ${TAG}"
            git push origin HEAD:main
          fi

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: cp app/build/outputs/apk/release/app-release.apk "NullX11-${TAG#v}.apk"

      - name: Create GitHub Release with the APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: NullX11 ${{ steps.ver.outputs.name }}
        run: gh release create "$TAG" "NullX11-*.apk" --title "$TITLE" --target main --generate-notes
